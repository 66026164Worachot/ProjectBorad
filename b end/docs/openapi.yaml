                  nullable: true
                isTrending:
                  type: boolean
      responses:
        '200':
          description: แก้ไขบอร์ดเกมสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Boardgame'
                  message:
                    type: string
        '400':
          description: ข้อมูลไม่ถูกต้อง
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ไม่พบบอร์ดเกม
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Boardgames]
      summary: ลบบอร์ดเกม (Manager)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ลบบอร์ดเกมสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: ไม่พบบอร์ดเกม
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
