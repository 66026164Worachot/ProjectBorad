openapi: 3.0.3
info:
  title: ProjectBorad REST API
  version: 1.0.0
  description: |
    เอกสารอธิบาย REST API ของระบบจองโต๊ะ ร้านอาหาร/บอร์ดเกม พร้อมการจัดการผู้ใช้ เมนู ออเดอร์ การจ่ายเงิน และแดชบอร์ดสรุปผล
    
    * Authentication ใช้ Bearer token (JWT) ที่ออกจาก `/api/auth/login`, `/api/auth/refresh` หรือ OAuth ของ Google
    * ทุก response จะมีคีย์ `ok` ระบุสถานะของคำขอเสมอ หาก `ok=false` ให้ตรวจสอบฟิลด์ `error`
servers:
  - url: http://localhost:3000
    description: Local development server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: INVALID_CREDENTIALS
            message:
              type: string
              example: Email or password is incorrect
            details:
              type: object
              additionalProperties: true
              nullable: true
          required:
            - code
      required:
        - ok
        - error
    MessageResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully
      required:
        - ok
    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 45
        totalPages:
          type: integer
          example: 3
    AuthTokens:
      type: object
      properties:
        access:
          type: string
          description: JWT access token (อายุสั้น)
        refresh:
          type: string
          description: JWT refresh token (อายุยาว)
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [user, staff, manager]
        full_name:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
    UserList:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
        pagination:
          $ref: '#/components/schemas/Pagination'
    UserStats:
      type: object
      properties:
        totalUsers:
          type: integer
        totalStaff:
          type: integer
        totalManagers:
          type: integer
        newUsersThisMonth:
          type: integer
    MenuCategory:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        display_order:
          type: integer
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
    MenuItem:
      type: object
      properties:
        id:
          type: string
        category_id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
          format: float
        image_url:
          type: string
          nullable: true
        is_available:
          type: boolean
        preparation_time:
          type: integer
          nullable: true
        tags:
          type: array
          items:
            type: string
          nullable: true
        display_order:
          type: integer
        stock_quantity:
          type: integer
        low_stock_threshold:
          type: integer
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        category:
          $ref: '#/components/schemas/MenuCategory'
    MenuItemList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MenuItem'
        pagination:
          $ref: '#/components/schemas/Pagination'
    FoodOrderItem:
      type: object
      properties:
        menu_item_id:
          type: string
        quantity:
          type: integer
        unit_price:
          type: number
          format: float
        subtotal:
          type: number
          format: float
        notes:
          type: string
          nullable: true
    FoodOrder:
      type: object
      properties:
        id:
          type: string
        booking_id:
          type: string
        order_number:
          type: string
        user_id:
          type: string
        table_id:
          type: string
        status:
          type: string
          enum: [pending, confirmed, preparing, served, completed, cancelled]
        total_amount:
          type: number
          format: float
        special_instructions:
          type: string
          nullable: true
        confirmed_by:
          type: string
          nullable: true
        confirmed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/FoodOrderItem'
    FoodOrderList:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/FoodOrder'
        pagination:
          $ref: '#/components/schemas/Pagination'
    Reservation:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        table_id:
          type: string
        booking_date:
          type: string
          format: date
        start_time:
          type: string
        end_time:
          type: string
        status:
          type: string
          enum: [waiting, approved, rejected, checked_in, checked_out, cancelled]
        number_of_people:
          type: integer
          nullable: true
        special_requests:
          type: string
          nullable: true
        promotion_id:
          type: string
          nullable: true
        payment_type:
          type: string
          enum: [advance, walk_in]
        total_amount:
          type: number
          format: float
          nullable: true
        deposit_amount:
          type: number
          format: float
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
    ReservationList:
      type: object
      properties:
        bookings:
          type: array
          items:
            $ref: '#/components/schemas/Reservation'
        pagination:
          $ref: '#/components/schemas/Pagination'
    Promotion:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        discount_type:
          type: string
          enum: [percentage, amount]
        discount_value:
          type: number
          format: float
        description:
          type: string
          nullable: true
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        max_uses:
          type: integer
          nullable: true
        min_amount:
          type: number
          format: float
          nullable: true
    Payment:
      type: object
      properties:
        id:
          type: string
        booking_id:
          type: string
        user_id:
          type: string
        payment_type:
          type: string
          enum: [deposit, remaining, full_payment]
        payment_method:
          type: string
          nullable: true
        amount:
          type: number
          format: float
        payment_status:
          type: string
          enum: [pending, verified, rejected]
        slip_image_url:
          type: string
          nullable: true
        transaction_ref:
          type: string
          nullable: true
        verified_by:
          type: string
          nullable: true
        verified_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
    PaymentList:
      type: object
      properties:
        payments:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
        pagination:
          $ref: '#/components/schemas/Pagination'
    PaymentStats:
      type: object
      properties:
        totalPayments:
          type: integer
        totalAmount:
          type: number
          format: float
        pendingPayments:
          type: integer
        verifiedPayments:
          type: integer
    DashboardStats:
      type: object
      properties:
        period:
          type: string
        summary:
          type: object
          additionalProperties: true
        reservations:
          type: object
          additionalProperties: true
        payments:
          type: object
          additionalProperties: true
        menu:
          type: object
          additionalProperties: true
    Boardgame:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        minPlayers:
          type: integer
          nullable: true
        maxPlayers:
          type: integer
          nullable: true
        playtimeMinutes:
          type: integer
          nullable: true
        complexity:
          type: string
          enum: [easy, medium, hard]
          nullable: true
        imageUrl:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        status:
          type: string
          enum: [available, unavailable, maintenance]
        availableQuantity:
          type: integer
          nullable: true
        isTrending:
          type: boolean
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
paths:
  /api/auth/register:
    post:
      tags: [Authentication]
      summary: ลงทะเบียนผู้ใช้ใหม่
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
      responses:
        '200':
          description: ลงทะเบียนสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                        format: email
        '400':
          description: ข้อมูลไม่ถูกต้อง
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: อีเมลถูกใช้แล้ว
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/login:
    post:
      tags: [Authentication]
      summary: เข้าสู่ระบบด้วย email/password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: เข้าสู่ระบบสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  tokens:
                    $ref: '#/components/schemas/AuthTokens'
        '401':
          description: ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/refresh:
    post:
      tags: [Authentication]
      summary: ขอ access token ใหม่ด้วย refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: ออก access token ใหม่สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  tokens:
                    type: object
                    properties:
                      access:
                        type: string
        '400':
          description: ไม่ส่ง refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: refresh token ไม่ถูกต้องหรือถูกเพิกถอน
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: เพิกถอน refresh token ปัจจุบัน
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: ออกจากระบบ (หรือ token ไม่ถูกพบ)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /api/auth/reset/request:
    post:
      tags: [Authentication]
      summary: ขอรหัสยืนยันรีเซ็ตรหัสผ่าน (รองรับเฉพาะ Gmail)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: ส่งอีเมลหรือให้ข้อความทั่วไปแล้ว
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  message:
                    type: string
                  expiresIn:
                    type: integer
                    nullable: true
        '400':
          description: ข้อมูลไม่ถูกต้องหรืออีเมลไม่ได้ใช้ Gmail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/reset/confirm:
    post:
      tags: [Authentication]
      summary: ยืนยันรหัสรีเซ็ตรหัสผ่านและตั้งรหัสใหม่
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, newPassword]
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                newPassword:
                  type: string
                  minLength: 6
      responses:
        '200':
          description: เปลี่ยนรหัสผ่านสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: รหัสไม่ถูกต้องหรือหมดอายุ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/google:
    get:
      tags: [Authentication]
      summary: Redirect ไป Google OAuth consent screen
      responses:
        '302':
          description: Redirect ไปยัง Google
  /api/auth/google/callback:
    get:
      tags: [Authentication]
      summary: Callback จาก Google OAuth (redirect กลับ frontend พร้อมโทเคน)
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect กลับสู่หน้าเว็บพร้อม JWT
  /api/protect/me/profile:
    get:
      tags: [Profile]
      summary: ดูข้อมูลโปรไฟล์ของผู้ใช้ปัจจุบัน
      security:
        - bearerAuth: []
      responses:
        '200':
          description: ข้อมูลผู้ใช้
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
        '401':
          description: ไม่ได้เข้าสู่ระบบหรือ token ไม่ถูกต้อง
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Profile]
      summary: แก้ไขข้อมูลส่วนตัวของผู้ใช้ปัจจุบัน
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
      responses:
        '200':
          description: แก้ไขข้อมูลสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                  message:
                    type: string
        '400':
          description: ข้อมูลไม่ผ่าน validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/protect/me/password:
    put:
      tags: [Profile]
      summary: เปลี่ยนรหัสผ่านของผู้ใช้ปัจจุบัน
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: เปลี่ยนรหัสผ่านสำเร็จและเพิกถอน sessions อื่นๆ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: รหัสผ่านเดิมไม่ถูกต้องหรือรหัสใหม่สั้นเกินไป
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/protect/me/logout-others:
    post:
      tags: [Profile]
      summary: เพิกถอน refresh token ทั้งหมด (ยกเว้นปัจจุบัน)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                currentRefreshToken:
                  type: string
                  description: ส่งมาเพื่อเก็บ session ปัจจุบันไว้ได้
      responses:
        '200':
          description: ล็อกเอาต์ sessions อื่นสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: ข้อมูลไม่ครบหรือ refresh token ไม่ถูกต้อง
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/protect/me:
    delete:
      tags: [Profile]
      summary: ลบบัญชีตัวเอง (ต้องยืนยันด้วยรหัสผ่าน)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        '200':
          description: ลบบัญชีสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: รหัสผ่านไม่ถูกต้องหรือบัญชีมีความสัมพันธ์กับข้อมูลอื่น
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/users:
    get:
      tags: [User Management]
      summary: ดึงรายชื่อผู้ใช้ (Staff/Manager เท่านั้น)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: role
          schema:
            type: string
            enum: [user, staff, manager]
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: รายชื่อผู้ใช้พร้อม pagination
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/UserList'
        '401':
          description: ไม่ได้เข้าสู่ระบบหรือสิทธิ์ไม่พอ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [User Management]
      summary: สร้างผู้ใช้ใหม่ (staff สร้างได้เฉพาะ user)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
                full_name:
                  type: string
                  nullable: true
                phone:
                  type: string
                  nullable: true
                role:
                  type: string
                  enum: [user, staff, manager]
      responses:
        '201':
          description: สร้างผู้ใช้สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/User'
                  message:
                    type: string
        '400':
          description: ข้อมูลไม่ครบหรือ password สั้นเกินไป
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: อีเมลถูกใช้แล้ว
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/users/stats:
    get:
      tags: [User Management]
      summary: ดูสถิติผู้ใช้ทั้งหมด
      security:
        - bearerAuth: []
      responses:
        '200':
